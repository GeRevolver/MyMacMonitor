name: M9Volume

options:
  bundleIdPrefix: com.omer
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  M9Volume:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleName: M9Volume
        CFBundleDisplayName: M9 Volume
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true                # menu-bar agent: no Dock icon / main window
        LSMinimumSystemVersion: "13.0"
        NSAppTransportSecurity:          # allow plain-http :8001 discovery + self-signed wss :8002
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omer.m9volume
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        # NOTE: no entitlements file is declared on purpose -> App Sandbox is OFF.
        # A sandboxed app cannot create the global CGEventTap, so do NOT add the
        # "App Sandbox" capability in Xcode.
        CODE_SIGN_STYLE: Automatic
        # Set your Team ID so signing is stable and Accessibility / Launch-at-Login
        # permissions persist across rebuilds. Find it in Xcode > Settings > Accounts,
        # or: security find-identity -v -p codesigning   (the 10-char ID in the name).
        # DEVELOPMENT_TEAM: ABCDE12345
