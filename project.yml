name: MyMacMonitor

# Optional Xcode route (xcodegen generate). The supported, dependency-free build is ./build.sh.
options:
  bundleIdPrefix: io.github.gerevolver
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  MyMacMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: MyMacMonitor
        CFBundleDisplayName: MyMacMonitor
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSUIElement: true                # menu-bar agent: no Dock icon / main window
        LSMinimumSystemVersion: "13.0"
        NSAppTransportSecurity:          # LAN-only exemption: plain-http :8001 discovery + self-signed wss :8002
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gerevolver.mymacmonitor
        PRODUCT_NAME: MyMacMonitor
        EXECUTABLE_NAME: MyMacMonitor
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_HARDENED_RUNTIME: YES
        # NOTE: no entitlements file is declared on purpose -> App Sandbox is OFF.
        # A sandboxed app cannot create the global CGEventTap, so do NOT add the
        # "App Sandbox" capability in Xcode.
        CODE_SIGN_STYLE: Automatic
